# Explicit opt-in: ordinary crew continue using upstream medicine.
- type: entity
  parent: OperatingTable
  id: MedicalTestOperatingTable
  name: experimental operating table
  suffix: Experimental Physiology
  description: Buckle the patient here for experimental surgery. Use the tool's surgery actions in the patient's context menu.
  components:
  - type: MedicalOperatingTable

- type: entity
  parent: BaseHealingItem
  id: MedicalTestOrganRepairKit
  name: experimental organ repair supplies
  suffix: Experimental Physiology
  description: Repairs an exposed internal organ after incision, clamping and retraction on an experimental operating table. Cannot repair brain damage or replace missing organs.
  components:
  - type: Sprite
    state: gauze
  - type: Item
    heldPrefix: gauze
  - type: InternalTraumaTreatment
  - type: Stack
    stackType: MedicalTestOrganRepair
    count: 10

- type: stack
  id: MedicalTestOrganRepair
  name: experimental organ repair supplies
  icon: { sprite: Objects/Specific/Medical/medical.rsi, state: gauze }
  spawn: MedicalTestOrganRepairKit
  maxCount: 10

- type: entity
  parent: Scalpel
  id: MedicalTestScalpel
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Incise

- type: entity
  parent: Hemostat
  id: MedicalTestHemostat
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Clamp

- type: entity
  parent: Retractor
  id: MedicalTestRetractor
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Retract

- type: entity
  parent: Cautery
  id: MedicalTestCautery
  suffix: Experimental Physiology
  components:
