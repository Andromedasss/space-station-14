# Explicit opt-in: ordinary crew continue using upstream medicine.
- type: entity
  parent: Medkit
  id: MedicalTestOrganCase
  name: experimental organ preservation case
  suffix: Experimental Physiology
  description: Place organs inside to slow storage injury tenfold. A sealed coolant cartridge lasts ten minutes from creation, even when empty. Cannot restore existing damage. Replace the case when exhausted.
  components:
  - type: MedicalOrganPreservation
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,3

- type: entity
  parent: BaseItem
  id: MedicalTestAmbuBag
  name: experimental manual resuscitator
  suffix: Experimental Physiology
  description: Apply to another experimental patient for one assisted breath after a two-second squeeze. Repeat regularly. Uses a finite air reservoir. Does not replace blood, circulation or damaged lungs.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medical.rsi
    state: gauze
  - type: MedicalVentilation
    gasSupply:
      volume: 10
      moles:
        Oxygen: 2
        Nitrogen: 8
      temperature: 293.15

- type: reagent
  id: MedicalTestSedative
  name: reagent-name-medical-test-sedative
  desc: reagent-desc-medical-test-sedative
  physicalDesc: reagent-physical-desc-translucent
  group: Medicine
  flavor: medicine
  color: "#9586c9"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.1
      effects: []

- type: entity
  parent: ChemicalMedipen
  id: MedicalTestSedativeMedipen
  name: experimental anesthetic injector
  suffix: Experimental Physiology
  description: Delivers 5 units of experimental anesthetic. Causes unconsciousness and suppresses breathing. Monitor oxygen debt and provide assisted ventilation. Not a healing drug.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: MedicalTestSedative
        Quantity: 5

- type: reagent
  id: MedicalTestAnalgesic
  name: reagent-name-medical-test-analgesic
  desc: reagent-desc-medical-test-analgesic
  physicalDesc: reagent-physical-desc-translucent
  group: Medicine
  flavor: medicine
  color: "#68b5c9"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.1
      effects: []

- type: entity
  parent: ChemicalMedipen
  id: MedicalTestAnalgesicMedipen
  name: experimental analgesic injector
  suffix: Experimental Physiology
  description: Delivers 5 units of non-sedating experimental analgesic. Reduces perceived pain without healing injuries, stopping bleeding or restoring damaged limbs. Extra doses give no additional benefit. Not an anesthetic.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: MedicalTestAnalgesic
        Quantity: 5

- type: reagent
  id: MedicalTestInotrope
  name: reagent-name-medical-test-inotrope
  desc: reagent-desc-medical-test-inotrope
  physicalDesc: reagent-physical-desc-translucent
  group: Medicine
  flavor: medicine
  color: "#d98645"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects: []

- type: entity
  parent: ChemicalMedipen
  id: MedicalTestInotropeMedipen
  name: experimental inotrope injector
  suffix: Experimental Physiology
  description: Delivers 5 units of experimental inotrope through the normal injection system. Temporarily supports a weak existing heart. A bloodstream dose of 10 or more causes fibrillation. Cannot replace blood or repair tissue.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: MedicalTestInotrope
        Quantity: 5

- type: entity
  parent: OperatingTable
  id: MedicalTestOperatingTable
  name: experimental operating table
  suffix: Experimental Physiology
  description: Buckle the patient here for experimental surgery. Select a zone in the HUD and apply surgical instruments directly. The surgery panel provides debug operations and organ extraction selection.
  components:
  - type: MedicalOperatingTable

- type: entity
  parent: MedicalTestOperatingTable
  id: MedicalTestIntensiveCareBed
  name: experimental intensive care bed
  description: Buckle an experimental patient here for powered circulatory assistance and ventilation from a finite air reservoir. Does not replace blood, missing organs or destroyed tissue. Power loss or unbuckling stops assistance.
  suffix: Experimental Physiology
  components:
  - type: MedicalLifeSupport
    gasSupply:
      volume: 100
      moles:
        Oxygen: 20
        Nitrogen: 80
      temperature: 293.15
  - type: ApcPowerReceiver
    powerLoad: 2000
  - type: ExtensionCableReceiver
  - type: PowerSwitch

- type: entity
  parent: BaseHealingItem
  id: MedicalTestOrganRepairKit
  name: experimental organ repair supplies
  suffix: Experimental Physiology
  description: Repairs an exposed internal organ after incision, clamping and retraction on an experimental operating table. Cannot repair brain damage or replace missing organs.
  components:
  - type: Sprite
    state: gauze
  - type: Item
    heldPrefix: gauze
  - type: InternalTraumaTreatment
  - type: Stack
    stackType: MedicalTestOrganRepair
    count: 10

- type: stack
  id: MedicalTestOrganRepair
  name: medical-organ-repair-stack
  icon: { sprite: Objects/Specific/Medical/medical.rsi, state: gauze }
  spawn: MedicalTestOrganRepairKit
  maxCount: 10

- type: entity
  parent: Scalpel
  id: MedicalTestScalpel
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Incise

- type: entity
  parent: Hemostat
  id: MedicalTestHemostat
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Clamp

- type: entity
  parent: Retractor
  id: MedicalTestRetractor
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Retract

- type: entity
  parent: SawElectric
  id: MedicalTestBoneSaw
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: SawBone
    delay: 8

- type: entity
  parent: Cautery
  id: MedicalTestCautery
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Close

- type: entity
  parent: Hemostat
  id: MedicalTestExtractor
  name: experimental organ extractor
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Extract

- type: entity
  parent: Hemostat
  id: MedicalTestBoneSetter
  name: experimental bone fixation tool
  suffix: Experimental Physiology
  description: Restores skeletal support at an exposed fracture on an experimental operating table. Does not repair tissue damage.
  components:
  - type: MedicalSurgeryTool
    action: RepairFracture
    delay: 8

- type: entity
  parent: Hemostat
  id: MedicalTestVascularRepairTool
  name: experimental vascular repair tool
  suffix: Experimental Physiology
  description: Repairs an exposed deep vascular injury. External dressings cannot stop internal blood loss.
  components:
  - type: MedicalSurgeryTool
    action: RepairVessel
    delay: 8

- type: entity
  parent: Drill
  id: MedicalTestProstheticRepairTool
  name: experimental prosthetic repair tool
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: RepairProsthetic
    delay: 8

