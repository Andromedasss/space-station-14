# Explicit opt-in: ordinary crew continue using upstream medicine.
- type: reagent
  id: MedicalTestInotrope
  name: reagent-name-medical-test-inotrope
  desc: reagent-desc-medical-test-inotrope
  physicalDesc: reagent-physical-desc-translucent
  group: Medicine
  flavor: medicine
  color: "#d98645"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects: []

- type: entity
  parent: ChemicalMedipen
  id: MedicalTestInotropeMedipen
  name: experimental inotrope injector
  suffix: Experimental Physiology
  description: Delivers 5 units of experimental inotrope through the normal injection system. Temporarily supports a weak existing heart. A bloodstream dose of 10 or more causes fibrillation. Cannot replace blood or repair tissue.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: MedicalTestInotrope
        Quantity: 5

- type: entity
  parent: OperatingTable
  id: MedicalTestOperatingTable
  name: experimental operating table
  suffix: Experimental Physiology
  description: Buckle the patient here for experimental surgery. Use the tool's surgery actions in the patient's context menu.
  components:
  - type: MedicalOperatingTable

- type: entity
  parent: MedicalTestOperatingTable
  id: MedicalTestIntensiveCareBed
  name: experimental intensive care bed
  description: Buckle an experimental patient here for powered circulatory assistance and ventilation from a finite air reservoir. Does not replace blood, missing organs or destroyed tissue. Power loss or unbuckling stops assistance.
  suffix: Experimental Physiology
  components:
  - type: MedicalLifeSupport
    gasSupply:
      volume: 100
      moles:
        Oxygen: 20
        Nitrogen: 80
      temperature: 293.15
  - type: ApcPowerReceiver
    powerLoad: 2000
  - type: ExtensionCableReceiver
  - type: PowerSwitch

- type: entity
  parent: BaseHealingItem
  id: MedicalTestOrganRepairKit
  name: experimental organ repair supplies
  suffix: Experimental Physiology
  description: Repairs an exposed internal organ after incision, clamping and retraction on an experimental operating table. Cannot repair brain damage or replace missing organs.
  components:
  - type: Sprite
    state: gauze
  - type: Item
    heldPrefix: gauze
  - type: InternalTraumaTreatment
  - type: Stack
    stackType: MedicalTestOrganRepair
    count: 10

- type: stack
  id: MedicalTestOrganRepair
  name: medical-organ-repair-stack
  icon: { sprite: Objects/Specific/Medical/medical.rsi, state: gauze }
  spawn: MedicalTestOrganRepairKit
  maxCount: 10

- type: entity
  parent: Scalpel
  id: MedicalTestScalpel
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Incise

- type: entity
  parent: Hemostat
  id: MedicalTestHemostat
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Clamp

- type: entity
  parent: Retractor
  id: MedicalTestRetractor
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Retract

- type: entity
  parent: Cautery
  id: MedicalTestCautery
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Close

- type: entity
  parent: Hemostat
  id: MedicalTestExtractor
  name: experimental organ extractor
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: Extract

- type: entity
  parent: Hemostat
  id: MedicalTestBoneSetter
  name: experimental bone fixation tool
  suffix: Experimental Physiology
  description: Restores skeletal support at an exposed fracture on an experimental operating table. Does not repair tissue damage.
  components:
  - type: MedicalSurgeryTool
    action: RepairFracture
    delay: 8

- type: entity
  parent: Hemostat
  id: MedicalTestVascularRepairTool
  name: experimental vascular repair tool
  suffix: Experimental Physiology
  description: Repairs an exposed deep vascular injury. External dressings cannot stop internal blood loss.
  components:
  - type: MedicalSurgeryTool
    action: RepairVessel
    delay: 8

- type: entity
  parent: Drill
  id: MedicalTestProstheticRepairTool
  name: experimental prosthetic repair tool
  suffix: Experimental Physiology
  components:
  - type: MedicalSurgeryTool
    action: RepairProsthetic
    delay: 8

